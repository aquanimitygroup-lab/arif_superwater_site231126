<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Super Water Admin</title>
<link rel="icon" href="/assets/q-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/swlogo.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- Sign in -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <img src="/assets/aquanimity.png" alt="Aquanimity" class="login-logo">
    <h1>Super Water admin</h1>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" required>
    <p class="form-error" id="loginError" role="alert"></p>
    <div class="setup" id="setupBox" hidden></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</main>

<!-- App -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand">
      <img src="/assets/aquanimity-white.png" alt="Aquanimity">
      <span class="sw"><img src="/assets/sw-en.svg" alt="Super Water" width="769" height="337"></span>
    </div>
    <nav id="nav" aria-label="Admin sections"></nav>
    <div class="side-foot">
      <div id="whoami" class="who"></div>
      <a href="/" target="_blank" rel="noopener" class="side-link">View website ↗</a>
      <button id="logout" class="side-link" type="button">Sign out</button>
    </div>
  </aside>
  <section class="main">
    <header class="topbar">
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="Menu">☰</button>
      <h1 id="pageTitle"></h1>
      <div id="pageActions" class="page-actions"></div>
    </header>
    <div id="view" class="view"></div>
  </section>
</div>

<!-- Order detail panel -->
<div id="scrim" class="scrim" hidden></div>
<aside id="panel" class="panel" hidden aria-label="Order details">
  <header><h2 id="panelTitle"></h2><button id="panelClose" class="icon" type="button" aria-label="Close">✕</button></header>
  <div id="panelBody" class="panel-body"></div>
</aside>

<div id="toast" class="toast" role="status"></div>

<script type="module" src="/admin/admin.js"></script>
</body>
</html>
